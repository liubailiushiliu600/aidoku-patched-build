# 把 Aidoku + 批量导入补丁编译成「未签名 IPA」，丢给巨魔安装。
#
# 为什么需要它：
#   iOS 应用只能在 macOS + Xcode 上构建，Windows 做不到。
#   GitHub Actions 提供免费的 macOS 虚拟机（公开仓库免费），
#   这是「手头没有 Mac 也能编出 IPA」的唯一正规路子。
#
# 为什么不用签名：
#   巨魔（TrollStore）会对 IPA 里的二进制做 fakesign 并保留任意 entitlements，
#   所以「完全未签名」的 IPA 正是巨魔最想要的形式，不需要 Apple 开发者账号。
#   下面的 CODE_SIGNING_ALLOWED=NO 就是干这个的，和 Aidoku 官方 nightly 用的是同一套参数。
#
# ⚠️ 关于 ref 为什么固定成 60f990d6（重要，别随便改回 main）：
#   Aidoku 上游在 2026-10-16 的提交 1c44a87b 里开始使用 @ContentBuilder ——
#   这是 iOS 27 SDK 才有的新特性，必须配 Xcode 27 才能编译。
#   而 GitHub 免费 runner 上最高只有 Xcode 26.6，编 main 会直接报：
#       error: unknown attribute 'ContentBuilder'
#       error: 'submitTaskRequest' has been renamed to 'submit(_:)'
#   上游为此把 CI 换成了自建的 xcode-27 镜像，那个免费账号用不了。
#   60f990d66850813cd791a382aea849c847b5e44c 是最后一个能配 Xcode 26.6 编过的提交
#   （上游自己在这个 commit 上跑通过 nightly，用时 9m44s）。
#   想换版本时，请选一个「上游用 macos-26 + Xcode 26.x 跑绿过」的 commit。
#
# 怎么用（不需要 fork Aidoku）：
#   1. 在 GitHub 上新建一个空仓库（公开的，公开仓库的 macOS runner 免费）
#   2. 把这个文件和 aidoku-bulk-import.patch 一起放进去，目录结构：
#          <你的仓库>/
#              aidoku-bulk-import.patch
#              .github/workflows/build-aidoku-ipa.yml   ← 本文件
#   3. 推到 GitHub
#   4. 仓库页面 → Actions → 左侧选 "Build Aidoku (bulk import patch)" → Run workflow
#   5. 跑完（约 10~20 分钟）在页面底部 Artifacts 里下载 Aidoku-patched-unsigned.ipa
#   6. 传到 iPad，用巨魔打开安装
#
# 排错：
#   * 如果 setup-xcode 找不到 26.6，说明镜像变了，改成 runner 上实际有的版本
#   * 如果 git apply 报冲突，说明目标 commit 动了同样的行，需要重新生成补丁
#   * 构建日志里搜 "error:" 定位具体编译错误

name: Build Aidoku (bulk import patch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Aidoku 上游 commit / 分支 / 标签"
        required: false
        # 最后一个能配 Xcode 26.x 编过的提交，见文件头说明
        default: "60f990d66850813cd791a382aea849c847b5e44c"

jobs:
  build-ios:
    # macos-26 才有 Xcode 26.x；macos-15 最高只到 26.3
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: 取出本仓库（补丁 + 本 workflow）
        uses: actions/checkout@v7
        with:
          path: self

      - name: 拉取 Aidoku 上游源码
        uses: actions/checkout@v7
        with:
          repository: Aidoku/Aidoku
          ref: ${{ inputs.ref }}
          path: src

      - name: 应用批量导入补丁
        run: |
          set -e
          cd src
          git apply --verbose "$GITHUB_WORKSPACE/self/aidoku-bulk-import.patch"
          echo "--- 补丁应用后的改动 ---"
          git diff --stat

      - name: 选择 Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: 安装 iOS 平台
        run: |
          xcrun simctl list > /dev/null # 修掉下一条命令偶发失败的问题
          xcodebuild -downloadPlatform iOS || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 构建（不签名）
        working-directory: src
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            archive \
            -archivePath build/Aidoku.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包成 IPA
        working-directory: src
        run: |
          set -e
          APP="build/Aidoku.xcarchive/Products/Applications/Aidoku.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到 $APP，构建可能失败了"
            exit 1
          fi
          rm -rf Payload Aidoku-patched-unsigned.ipa
          mkdir Payload
          cp -r "$APP" Payload/
          # IPA 就是「一个叫 Payload 的目录，里面放 .app」再 zip 起来
          zip -qry Aidoku-patched-unsigned.ipa Payload
          ls -lh Aidoku-patched-unsigned.ipa
          echo "包内结构："
          unzip -l Aidoku-patched-unsigned.ipa | head -10

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-patched-unsigned-ipa
          path: src/Aidoku-patched-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
