# 把 Aidoku + 批量导入补丁编译成「未签名 IPA」，丢给巨魔安装。
#
# 为什么需要它：
#   iOS 应用只能在 macOS + Xcode 上构建，Windows 做不到。
#   GitHub Actions 提供免费的 macOS 虚拟机（公开仓库免费），
#   这是「手头没有 Mac 也能编出 IPA」的唯一正规路子。
#
# 为什么不用签名：
#   巨魔（TrollStore）会对 IPA 里的二进制做 fakesign 并保留任意 entitlements，
#   所以「完全未签名」的 IPA 正是巨魔最想要的形式，不需要 Apple 开发者账号。
#   本 workflow 里的 CODE_SIGNING_ALLOWED=NO 就是干这个的，和 Aidoku 官方
#   nightly 构建用的是同一套参数。
#
# 怎么用（不需要 fork Aidoku）：
#   1. 在 GitHub 上新建一个空仓库（公开的，公开仓库的 macOS runner 免费）
#   2. 把这个文件和 aidoku-bulk-import.patch 一起放进去，目录结构：
#          <你的仓库>/
#              aidoku-bulk-import.patch
#              .github/workflows/build-aidoku-ipa.yml   ← 本文件
#   3. 推到 GitHub
#   4. 仓库页面 → Actions → 左侧选 "Build Aidoku (bulk import patch)" → Run workflow
#   5. 跑完（约 10~20 分钟）在页面底部 Artifacts 里下载 Aidoku-patched-unsigned.ipa
#   6. 传到 iPad，用巨魔打开安装
#
# 想更新到 Aidoku 最新代码：直接再跑一次这个 workflow，不用改任何东西。
#
# 如果你更想用 fork：
#   把补丁 git apply 到自己的 fork 里推上去，然后删掉下面「拉取上游」和「应用补丁」
#   两步，把「构建」那步的 working-directory 从 src 改成 . 即可。
#
# 排错：
#   * 如果报 Xcode / SDK 版本过低，把 runs-on 换成 macos-latest 或更新的镜像标签
#   * 如果 git apply 报冲突，说明上游改动动到了同样的行，需要重新生成补丁
#   * 构建日志里搜 "error:" 定位具体编译错误

name: Build Aidoku (bulk import patch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Aidoku 上游分支或标签（默认 main）"
        required: false
        default: "main"

jobs:
  build-ios:
    # macOS runner 是硬性要求，换不了
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 取出本仓库（补丁 + 本 workflow）
        uses: actions/checkout@v7
        with:
          path: self

      - name: 拉取 Aidoku 上游源码
        uses: actions/checkout@v7
        with:
          repository: Aidoku/Aidoku
          ref: ${{ inputs.ref }}
          path: src

      - name: 应用批量导入补丁
        run: |
          set -e
          cd src
          git apply --verbose "$GITHUB_WORKSPACE/self/aidoku-bulk-import.patch"
          echo "--- 补丁应用后的改动 ---"
          git diff --stat

      - name: 选用 runner 上最新的 Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          echo "--- 可用的 iOS SDK ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 构建（不签名）
        working-directory: src
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            archive \
            -archivePath build/Aidoku.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包成 IPA
        working-directory: src
        run: |
          set -e
          APP="build/Aidoku.xcarchive/Products/Applications/Aidoku.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到 $APP，构建可能失败了"
            exit 1
          fi
          rm -rf Payload Aidoku-patched-unsigned.ipa
          mkdir Payload
          cp -r "$APP" Payload/
          # IPA 就是「一个叫 Payload 的目录，里面放 .app」再 zip 起来
          zip -qry Aidoku-patched-unsigned.ipa Payload
          ls -lh Aidoku-patched-unsigned.ipa
          echo "包内结构："
          unzip -l Aidoku-patched-unsigned.ipa | head -10

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-patched-unsigned-ipa
          path: src/Aidoku-patched-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
